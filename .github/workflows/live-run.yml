name: Live triage run

# Manual only. Each run costs a handful of Gemini free-tier calls, and there is
# no reason to spend them on every push.
on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: "Commit the refreshed report and dashboard back to the branch"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The core pipeline is standard library only; this is for the Gemini tier
      # (urllib, so nothing to install) and the test suite.
      - name: Install test dependencies
        run: pip install --quiet pytest

      - name: Run the suite
        run: python -m pytest tests/ -q

      - name: Reconcile with live triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set."
            echo "Add it at Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          make demo | tee docs/sample-run.txt
          # Fail loudly rather than silently committing another offline run.
          if grep -q "SIMULATED offline classifier" docs/sample-run.txt; then
            echo "::error::Run fell back to the offline classifier; the key was not picked up."
            exit 1
          fi

      - name: Summarise on the run page
        if: always()
        run: |
          {
            echo '## Reconciliation report'
            echo '```'
            sed -n '/RECONCILIATION REPORT/,/^====/p' docs/sample-run.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-run
          path: |
            docs/sample-run.txt
            out/report.json
            out/audit.jsonl
            out/dashboard.html

      - name: Commit the live numbers
        if: inputs.commit_results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sample-run.txt
          git diff --staged --quiet || git commit -m "evaluation: live triage run on Gemini"
          git push
